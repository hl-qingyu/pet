name: 打包 Mac 桌宠

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包 Mac 版本
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: DragonDesk-mac
          path: dist/*.zip
          if-no-files-found: error
